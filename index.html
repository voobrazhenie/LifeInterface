<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#17171a">
<title>Life Interface</title>
<style>
  /* Dark unconditionally — see the note in fitness/index.html. */
  :root {
    --bg: #17171a; --panel: #1f1f23; --ink: #edeae4; --ink-soft: #a5a19a;
    --ink-faint: #77736c; --line: #32323a; --accent: #e8834a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 15vh 20px 60px; background: var(--bg); color: var(--ink);
    font: 16px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .eyebrow {
    font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 8px;
  }
  h1 {
    font-size: clamp(32px, 9vw, 44px); margin: 0 0 12px; font-weight: 600;
    letter-spacing: -.02em; line-height: 1.05;
  }
  .lede { color: var(--ink-soft); margin: 0 0 34px; max-width: 46ch; }
  a.card {
    display: block; text-decoration: none; color: inherit; background: var(--panel);
    border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 12px; padding: 17px 19px; margin-bottom: 10px;
    transition: border-color .16s, transform .08s;
  }
  a.card:hover { border-color: var(--ink-faint); border-left-color: var(--accent); }
  a.card:active { transform: translateY(1px); }
  a.card .name { font-size: 17px; font-weight: 600; }
  a.card .desc { font-size: 14px; color: var(--ink-soft); margin-top: 4px; }
  footer {
    margin-top: 44px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--ink-faint);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Life Interface</div>
  <h1>A place for the things I'm tracking.</h1>
  <p class="lede">Small pages, each one pointed at a single thing worth keeping honest.</p>

  <a class="card" href="fitness/">
    <div class="name">NOW → WANT</div>
    <div class="desc">Today's training, protein and recovery checklist, generated from the plan.</div>
  </a>

  <footer>Static pages on GitHub Pages. Daily lists written by Claude Code.</footer>
</div>
</body>
</html>
